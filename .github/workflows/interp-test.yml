# 阶段一验收：AArch64 解释器指令级自测（基线向量 + 加固回归向量 + NEON 整数向量 + NEON 边界向量）
# 阶段二验收：系统调用代理层冒烟（真实 Linux 调用号 / 沙盒拦截 / -ENOSYS 回落）
#            最小 libc 冒烟（托管调用陷阱 / 内存·字符串·堆·格式化·文件转发）
# 不依赖 iOS 模拟器，直接在 macOS runner 上以命令行方式编译解释器核心并跑黄金向量，
# 最后附一轮吞吐量基准（信息性输出，不作为门禁）。

name: AArch64 Interpreter Tests

on:
  push:
    branches: [ main, "trae/**" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  interp-test:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          swift --version
          sw_vers

      - name: Build interpreter test harness and bench
        run: |
          set -euo pipefail
          FILES="Sources/native-loader/SDRArmFPU.swift \
                 Sources/native-loader/SDRArmNEON.swift \
                 Sources/native-loader/SDRArmInterpreter.swift \
                 Sources/native-loader/SDRHostCall.swift \
                 Sources/native-loader/SDRLibc.swift \
                 Sources/native-loader/SDRElfParser.swift \
                 Sources/native-loader/SDRElfDynamic.swift \
                 Sources/native-loader/SDRImageLoader.swift \
                 Sources/native-loader/SDRRelocator.swift \
                 Sources/native-loader/SDRSharedLibrary.swift \
                 Sources/apk-tool/SDRZipArchive.swift \
                 Sources/sandbox/SDRAddressSpaceAllocator.swift \
                 Sources/sandbox/SDRMemoryBudget.swift \
                 Sources/sandbox/SDRMemoryGuard.swift \
                 Sources/sandbox/SDRMemoryPressureMonitor.swift \
                 Sources/sandbox/SDRSandbox.swift \
                 Sources/tools/SDRAlu.swift \
                 Sources/tools/SDRByteReader.swift \
                 Sources/tools/SDRLogger.swift \
                 Sources/tools/SDRSystemProbe.swift \
                 Sources/tools/SDRTime.swift \
                 Sources/framework/SDRCore.swift \
                 Sources/framework/SDREventBus.swift \
                 Sources/framework/SDRLicense.swift \
                 Sources/framework/SDRLogStore.swift \
                 Sources/framework/SDRSettingsStore.swift \
                 Sources/ios-adapter/SDRFileDescriptorTable.swift \
                 Sources/ios-adapter/SDRSyscallNumber.swift \
                 Sources/ios-adapter/SDRSystemServices.swift"
          swiftc -swift-version 5 -O -o interp-test $FILES Tests/interp/main.swift
          swiftc -swift-version 5 -O -o bench $FILES Tests/interp/bench.swift
          swiftc -swift-version 5 -O -o syscall-smoke $FILES Tests/interp/syscall_smoke/main.swift
          swiftc -swift-version 5 -O -o libc-smoke $FILES Tests/interp/libc_smoke/main.swift
          swiftc -swift-version 5 -O -o elf-smoke $FILES Tests/interp/elf_smoke/main.swift
          swiftc -swift-version 5 -O -o dl-smoke $FILES Tests/interp/dl_smoke/main.swift
          swiftc -swift-version 5 -O -o zip-smoke $FILES Tests/interp/zip_smoke/main.swift
          swiftc -swift-version 5 -O -o settings-smoke $FILES Tests/interp/settings_smoke/main.swift
          swiftc -swift-version 5 -O -o host-smoke $FILES Tests/interp/host_smoke/main.swift

      - name: Run acceptance vectors (baseline)
        run: |
          set -euo pipefail
          ./interp-test Tests/interp/vectors.json

      - name: Run hardening regression vectors
        run: |
          set -euo pipefail
          ./interp-test Tests/interp/vectors_hardening.json

      - name: Run NEON integer vectors
        run: |
          set -euo pipefail
          ./interp-test Tests/interp/vectors_neon.json

      - name: Run NEON boundary vectors
        run: |
          set -euo pipefail
          ./interp-test Tests/interp/vectors_neon2.json

      - name: Run syscall proxy smoke (stage 2)
        run: |
          set -euo pipefail
          ./syscall-smoke

      - name: Run minimal libc smoke (stage 2)
        run: |
          set -euo pipefail
          ./libc-smoke

      - name: Run SO loader smoke (stage 2)
        run: |
          set -euo pipefail
          ./elf-smoke

      - name: Run dynamic dependency smoke (stage 2)
        run: |
          set -euo pipefail
          ./dl-smoke

      - name: Run ZIP archive smoke
        run: |
          set -euo pipefail
          ./zip-smoke

      - name: Run settings persistence smoke
        run: |
          set -euo pipefail
          ./settings-smoke

      - name: Run host stub binding smoke (stage 2)
        run: |
          set -euo pipefail
          ./host-smoke

      - name: Throughput benchmark (informational)
        run: |
          set -euo pipefail
          ./bench Tests/interp/bench.json 3 || true
