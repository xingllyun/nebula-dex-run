name: iOS Unsigned Build

on:
  push:
    branches: [ main, "trae/**" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          sw_vers

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project NebulaDex.xcodeproj \
            -scheme NebulaDex \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tee build.log

      - name: Package unsigned IPA
        run: |
          set -e
          APP_PATH="build/Build/Products/Release-iphoneos/NebulaDex.app"
          test -d "$APP_PATH"
          rm -rf Payload NebulaDex-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry NebulaDex-unsigned.ipa Payload
          ls -lh NebulaDex-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NebulaDex-unsigned-ipa
          path: NebulaDex-unsigned.ipa

      - name: Publish release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" NebulaDex-unsigned.ipa \
            --title "$TAG" \
            --notes "自动构建：$(date -u +'%Y-%m-%d %H:%M UTC') | commit ${{ github.sha }}" \
            --target "${{ github.sha }}" || true
