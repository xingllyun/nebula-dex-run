name: 功能需求
description: 提出新能力、架构调整或体验改进（会进入路线图排期）
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        阶段划分参考 docs/NebulaDex-项目开发文档.md 与 docs/NebulaDex-全链路升级执行文档-V4.1.md。
        涉及架构路线（后端选型、包体策略、商业化的项）请在本表单中说明取舍理由。
  - type: dropdown
    id: stage
    attributes:
      label: 目标阶段
      options:
        - 阶段一 AArch64 / 系统库基线
        - 阶段二 系统库 / 沙箱
        - 阶段三 DEX 解释器
        - 阶段四 渲染层 / 触控
        - 阶段五 JNI / GC / invokedynamic
        - 跨阶段 / 架构级
        - 未定
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述当前痛点或能力缺口，而不是直接给方案
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案与取舍
      description: 若涉及架构或体积策略变更，请写明为何不改用现有链路
    validations:
      required: false
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 可验证的完成条件，例如新增冒烟用例、CI 门禁通过、指标阈值
      placeholder: |
        - 新增 Tests/interp/xxx_smoke 用例并通过 CI
        - 首屏硬限 150ms 内
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 影响面自检
      options:
        - label: 该需求不触碰稳定区（native-loader / sandbox 既有行为）
          required: false
        - label: 该需求需要同步更新开发文档
          required: false
